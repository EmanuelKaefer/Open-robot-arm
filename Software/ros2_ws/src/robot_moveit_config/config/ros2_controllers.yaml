# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 10  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - shoulder_joint1
      - shoulder_joint2
      - elbow_joint
      - wrist_turn_joint
      - wrist_tilt_joint
      - gripper_turn_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
    open_loop_control: true          # WICHTIG für Simulationen
    allow_partial_joints_goal: true