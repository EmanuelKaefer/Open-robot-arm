
<style>
  .metric-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 1rem; }
  .metric-label { font-size: 13px; color: var(--color-text-secondary); margin: 0 0 4px; }
  .metric-value { font-size: 24px; font-weight: 500; margin: 0; color: var(--color-text-primary); }
  .metric-unit { font-size: 13px; color: var(--color-text-secondary); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .status-dot.connected { background: #1D9E75; }
  .status-dot.disconnected { background: #E24B4A; }
  .log-box { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px; font-family: var(--font-mono); font-size: 12px; color: var(--color-text-secondary); height: 120px; overflow-y: auto; }
  .bar-wrap { background: var(--color-background-secondary); border-radius: 4px; height: 8px; overflow: hidden; margin-top: 6px; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
</style>

<h2 class="sr-only">Echtzeit-Dashboard für System- und Applikationsmetriken</h2>

<div style="padding: 1rem 0;">
  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
    <span style="font-size: 15px; font-weight: 500; color: var(--color-text-primary);">Realtime Dashboard</span>
    <span id="status-text" style="font-size: 13px; color: var(--color-text-secondary);">
      <span class="status-dot disconnected" id="status-dot"></span>Nicht verbunden
    </span>
  </div>

  <div style="margin-bottom: 12px;">
    <label style="font-size: 13px; color: var(--color-text-secondary);">WebSocket URL</label>
    <div style="display: flex; gap: 8px; margin-top: 4px;">
      <input id="ws-url" type="text" value="ws://localhost:8000/ws/dashboard/browser1" style="flex: 1; font-size: 13px;" />
      <button id="connect-btn" onclick="toggleConnect()">Verbinden</button>
    </div>
  </div>

  <p style="font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin: 1.5rem 0 8px;">System</p>
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 1.5rem;">
    <div class="metric-card">
      <p class="metric-label">CPU</p>
      <p class="metric-value" id="cpu">—<span class="metric-unit"> %</span></p>
      <div class="bar-wrap"><div class="bar-fill" id="cpu-bar" style="width: 0%; background: #378ADD;"></div></div>
    </div>
    <div class="metric-card">
      <p class="metric-label">RAM genutzt</p>
      <p class="metric-value" id="ram">—<span class="metric-unit"> GB</span></p>
      <div class="bar-wrap"><div class="bar-fill" id="ram-bar" style="width: 0%; background: #1D9E75;"></div></div>
    </div>
    <div class="metric-card">
      <p class="metric-label">RAM gesamt</p>
      <p class="metric-value" id="ram-total">—<span class="metric-unit"> GB</span></p>
    </div>
  </div>

  <p style="font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin: 0 0 8px;">Applikation</p>
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 1.5rem;">
    <div class="metric-card">
      <p class="metric-label">Requests</p>
      <p class="metric-value" id="req">—</p>
    </div>
    <div class="metric-card">
      <p class="metric-label">Fehlerrate</p>
      <p class="metric-value" id="err-rate">—<span class="metric-unit"> %</span></p>
    </div>
    <div class="metric-card">
      <p class="metric-label">Ø Response</p>
      <p class="metric-value" id="resp">—<span class="metric-unit"> ms</span></p>
    </div>
  </div>

  <p style="font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin: 0 0 8px;">Log</p>
  <div class="log-box" id="log"></div>
</div>

<script>
let ws = null;
let ramTotal = null;

function log(msg) {
  const box = document.getElementById('log');
  const time = new Date().toLocaleTimeString('de-AT');
  box.innerHTML += `<div>${time}  ${msg}</div>`;
  box.scrollTop = box.scrollHeight;
}

function setStatus(connected) {
  document.getElementById('status-dot').className = 'status-dot ' + (connected ? 'connected' : 'disconnected');
  document.getElementById('status-text').innerHTML = '<span class="status-dot ' + (connected ? 'connected' : 'disconnected') + '" id="status-dot"></span>' + (connected ? 'Verbunden' : 'Nicht verbunden');
  document.getElementById('connect-btn').textContent = connected ? 'Trennen' : 'Verbinden';
}

function toggleConnect() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.close();
    return;
  }
  const url = document.getElementById('ws-url').value.trim();
  try {
    ws = new WebSocket(url);
    log('Verbinde mit ' + url + ' …');
    ws.onopen = () => {
      setStatus(true);
      log('Verbunden.');
      ws.send(JSON.stringify({ action: 'subscribe', channel: 'application' }));
    };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.channel === 'system') {
        const d = msg.data;
        document.getElementById('cpu').innerHTML = parseFloat(d.cpu_percent).toFixed(1) + '<span class="metric-unit"> %</span>';
        document.getElementById('ram').innerHTML = parseFloat(d.memory_used_gb).toFixed(2) + '<span class="metric-unit"> GB</span>';
        document.getElementById('ram-total').innerHTML = parseFloat(d.memory_total_gb).toFixed(1) + '<span class="metric-unit"> GB</span>';
        document.getElementById('cpu-bar').style.width = Math.min(d.cpu_percent, 100) + '%';
        if (!ramTotal) ramTotal = d.memory_total_gb;
        document.getElementById('ram-bar').style.width = Math.min((d.memory_used_gb / ramTotal) * 100, 100).toFixed(1) + '%';
      }
      if (msg.channel === 'application') {
        const d = msg.data;
        document.getElementById('req').textContent = d.requests_total;
        document.getElementById('err-rate').innerHTML = parseFloat(d.error_rate).toFixed(2) + '<span class="metric-unit"> %</span>';
        document.getElementById('resp').innerHTML = parseFloat(d.avg_response_ms).toFixed(0) + '<span class="metric-unit"> ms</span>';
      }
      if (msg.status) {
        log('Kanal ' + msg.channel + ': ' + msg.status);
      }
    };
    ws.onerror = () => log('Fehler bei der Verbindung.');
    ws.onclose = () => { setStatus(false); log('Verbindung getrennt.'); };
  } catch(err) {
    log('Ungültige URL.');
  }
}
</script>
